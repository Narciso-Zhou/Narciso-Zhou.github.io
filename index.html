<script>
// ---------- 标准档位 ----------
const APERTURES = [1,1.2,1.4,1.7,1.8,2,2.2,2.5,2.8,3.2,3.5,4,4.5,5,5.6,6.3,7.1,8,9,10,11,13,14,16,18,20,22];
const SHUTTERS  = [1/8000,1/6400,1/5000,1/4000,1/3200,1/2500,1/2000,1/1600,1/1250,1/1000,1/800,1/640,1/500,1/400,1/320,1/250,1/200,1/160,1/125,1/100,1/80,1/60,1/50,1/40,1/30,1/25,1/20,1/15,1/13,1/10,1/8,1/6,1/5,1/4,0.3,0.4,0.5,0.6,0.8,1,1.3,1.6,2,2.5,3.2,4,5,6,8,10,13,15,20,25,30];
const ISOS      = [25,32,40,50,64,80,100,125,160,200,250,320,400,500,640,800,1000,1250,1600,2000,2500,3200,4000,5000,6400,8000,10000,12800,16000,20000,25600,51200];

function fillDatalist(id, items, fmt) {
  const dl = document.getElementById(id);
  items.forEach(v => {
    const o = document.createElement('option');
    o.value = fmt(v);
    dl.appendChild(o);
  });
}
fillDatalist('apList', APERTURES, v => v);
fillDatalist('shList', SHUTTERS, v => fmtShutter(v));
fillDatalist('isoList', ISOS, v => v);

// ---------- 工具函数 ----------
function parseShutter(str) {
  if (!str) return NaN;
  str = String(str).trim().replace(/秒|s$/i, '');
  if (str.includes('/')) {
    const [a, b] = str.split('/').map(parseFloat);
    return b ? a / b : NaN;
  }
  return parseFloat(str);
}
function fmtShutter(t) {
  if (t >= 1) return (Math.round(t * 10) / 10) + ' s';
  const d = Math.round(1 / t);
  return '1/' + d + ' s';
}
function nearest(arr, val) {
  let best = arr[0], bd = Infinity;
  for (const v of arr) {
    const d = Math.abs(Math.log2(v / val));
    if (d < bd) { bd = d; best = v; }
  }
  return { value: best, stops: Math.log2(val / best) };
}
function fmtStops(x) {
  const a = Math.abs(x);
  if (a < 0.02) return '≈ 0 档';
  return (x > 0 ? '+' : '−') + a.toFixed(2) + ' 档';
}
function ev100(N, t) { return Math.log2(N * N / t); }

// ---------- 拍照 / 读取 EXIF ----------

const exifMeta = document.getElementById('exifMeta');

async function handleFile(file) {
  if (!file) return;
  thumb.src = URL.createObjectURL(file);
  thumb.style.display = 'block';
  setMsg('正在读取 EXIF…', 'ok');
  try {
    const ex = await exifr.parse(file, { pick: [
      'FNumber','ApertureValue','ExposureTime','ShutterSpeedValue',
      'ISO','ISOSpeedRatings','PhotographicSensitivity',
      'Make','Model','LensModel','DateTimeOriginal','FocalLength'
    ]});
    if (!ex) throw new Error('no exif');

    const N = ex.FNumber || (ex.ApertureValue ? Math.pow(Math.SQRT2, ex.ApertureValue) : NaN);
    const t = ex.ExposureTime || (ex.ShutterSpeedValue ? Math.pow(2, -ex.ShutterSpeedValue) : NaN);
    const S = ex.ISO || ex.ISOSpeedRatings || ex.PhotographicSensitivity || NaN;

    let filled = 0;
    if (isFinite(N)) { document.getElementById('a1').value = Math.round(N * 10) / 10; filled++; }
    if (isFinite(t)) { document.getElementById('t1').value = fmtShutter(t); filled++; }
    if (isFinite(S)) { document.getElementById('s1').value = Math.round(S); filled++; }

    const meta = [ex.Make, ex.Model, ex.LensModel, ex.FocalLength ? ex.FocalLength + 'mm' : '']
      .filter(Boolean).join(' · ');
    exifMeta.textContent = meta;
    exifMeta.style.display = meta ? 'block' : 'none';

    if (filled === 3) {
      setMsg(`已读取：f/${document.getElementById('a1').value} · ${fmtShutter(t)} · ISO ${Math.round(S)}`, 'ok');
    } else if (filled > 0) {
      setMsg('部分曝光参数缺失，请手动补全第 1 步。', 'err');
    } else {
      setMsg('照片不含曝光信息（可能被压缩过），请手动填写第 1 步。', 'err');
    }
  } catch (e) {
    setMsg('未能读取 EXIF，请手动填写第 1 步的三项参数。', 'err');
  }
}
document.getElementById('cameraInput').addEventListener('change', e => handleFile(e.target.files[0]));
document.getElementById('galleryInput').addEventListener('change', e => handleFile(e.target.files[0]));

// ---------- 求解逻辑 ----------
function setMsg(t, cls) {
  const m = document.getElementById('msg');
  m.textContent = t || '';
  m.className = cls || '';
}

function readSet(n) {
  return {
    N: parseFloat(document.getElementById('a' + n).value.replace(/^f\/?/i, '')),
    t: parseShutter(document.getElementById('t' + n).value),
    S: parseFloat(document.getElementById('s' + n).value)
  };
}

document.getElementById('calcBtn').addEventListener('click', () => {
  const a = readSet('1');
  if (![a.N, a.t, a.S].every(v => isFinite(v) && v > 0)) {
    setMsg('第 1 步的光圈、快门、ISO 需要齐全且为正数。', 'err');
    return;
  }
  const target = document.querySelector('input[name=solve]:checked').value;
  const b = readSet('2');
  const K = a.t * a.S / (a.N * a.N); // 曝光常数 t·S/N²

  let res, exactTxt, stdTxt, stdVal;
  if (target === 'aperture') {
    if (![b.t, b.S].every(v => isFinite(v) && v > 0))
      return setMsg('请填写第 2 步的快门和 ISO。', 'err');
    res = Math.sqrt(b.t * b.S / K);
    const n = nearest(APERTURES, res);
    exactTxt = 'f/' + res.toFixed(2);
    stdTxt = 'f/' + n.value; stdVal = n;
    document.getElementById('a2').value = n.value;
  } else if (target === 'shutter') {
    if (![b.N, b.S].every(v => isFinite(v) && v > 0))
      return setMsg('请填写第 2 步的光圈和 ISO。', 'err');
    res = K * b.N * b.N / b.S;
    const n = nearest(SHUTTERS, res);
    exactTxt = fmtShutter(res);
    stdTxt = fmtShutter(n.value); stdVal = n;
    document.getElementById('t2').value = fmtShutter(n.value);
  }

  const label = { aperture: '光圈', shutter: '快门' }[target];
  document.getElementById('rBig').textContent = label + ' ≈ ' + stdTxt;
  document.getElementById('rExact').textContent = exactTxt;
  document.getElementById('rStd').textContent = stdTxt;
  document.getElementById('rDiff').textContent = fmtStops(stdVal.stops);
  document.getElementById('evA').textContent = '照片曝光 EV₁₀₀ = ' + ev100(a.N, a.t).toFixed(1) + '（ISO ' + a.S + '）';

  const N2 = target === 'aperture' ? stdVal.value : b.N;
  const t2 = target === 'shutter' ? stdVal.value : b.t;
  document.getElementById('evB').textContent = '新组合 EV₁₀₀ = ' + ev100(N2, t2).toFixed(1);
  document.getElementById('result').style.display = 'block';
  setMsg('计算完成。', 'ok');
});

// ---------- 闪光灯计算（GN 法则） ----------
const POWERS = [1, 1/2, 1/4, 1/8, 1/16, 1/32, 1/64, 1/128];
function parsePower(str) {
  const [a, b] = str.split('/').map(parseFloat);
  return b ? a / b : a;
}
function fmtPower(f) { return f >= 1 ? '1/1' : '1/' + Math.round(1 / f); }

function setFMsg(t, cls) {
  const m = document.getElementById('fmsg');
  m.textContent = t || '';
  m.className = cls || '';
}

// GN 快捷档位
document.querySelectorAll('#gnChips button').forEach(btn => {
  btn.addEventListener('click', () => {
    document.getElementById('gn3').value = btn.dataset.gn;
  });
});

// 模式切换：显示对应选项块；非标准模式禁用「求光圈」
function syncFMode() {
  const m = document.querySelector('input[name=fmode]:checked').value;
  document.getElementById('fillBlock').style.display = m === 'fill' ? 'block' : 'none';
  document.getElementById('darkBlock').style.display = m === 'darken' ? 'block' : 'none';
  const apLabel = document.getElementById('fsolveApLabel');
  const apRadio = document.getElementById('fsolveAp');
  if (m === 'standard') {
    apLabel.classList.remove('disabled');
    apRadio.disabled = false;
  } else {
    apLabel.classList.add('disabled');
    apRadio.disabled = true;
    if (apRadio.checked)
      document.querySelector('input[name=fsolve][value=power]').checked = true;
  }
}
document.querySelectorAll('input[name=fmode]').forEach(r => r.addEventListener('change', syncFMode));
syncFMode();

document.getElementById('fcalcBtn').addEventListener('click', () => {
  // 全局参数
  const GN  = parseFloat(document.getElementById('gn3').value);
  const ISO = parseFloat(document.getElementById('s1').value);
  const nd  = parseFloat(document.getElementById('nd3').value);
  const evT = parseFloat(document.getElementById('ev3').value);
  const hss = document.getElementById('hss3').value === 'on';
  const t3  = parseShutter(document.getElementById('t3').value) || 1/125;
  const D   = parseFloat(document.getElementById('d3').value);
  const pw  = parsePower(document.getElementById('p3').value);

  if (!(GN > 0))  return setFMsg('请填写闪光指数 GN。', 'err');
  if (!(ISO > 0)) return setFMsg('ISO 取自第 1 步，请先拍照或手动填写感光度。', 'err');

  // HSS 开启且快门快于同步速度时，闪光有效输出约降 2 档（近似）
  const hssF = (hss && t3 < 1/200) ? 0.5 : 1;
  const ndF  = Math.pow(2, nd / 2);          // ND 需要的额外 GN 倍数
  const gnISO = GN * Math.sqrt(ISO / 100);   // ISO 修正后的 GN

  const mode   = document.querySelector('input[name=fmode]:checked').value;
  const target = document.querySelector('input[name=fsolve]:checked').value;

  // 确定「闪光正确曝光所需光圈」Nreq 与相机设定说明
  let Nreq, camTxt, ratioTxt = '';
  if (mode === 'standard') {
    Nreq = parseFloat(document.getElementById('a3').value);
    if (target !== 'fap' && !(Nreq > 0))
      return setFMsg('标准模式请填写相机光圈 f/。', 'err');
    camTxt = 'f/' + (Nreq || '—') + ' · ' + fmtShutter(t3) + ' · ISO ' + ISO;
  } else {
    const a = readSet('1');
    if (![a.N, a.t, a.S].every(v => isFinite(v) && v > 0))
      return setFMsg('填充 / 压暗模式需要第 1 步的环境光曝光（光圈、快门、ISO）。', 'err');
    if (mode === 'fill') {
      const R = parseFloat(document.querySelector('input[name=ratio]:checked').value);
      Nreq = a.N / Math.pow(2, R / 2); // 闪光单独正确曝光所需光圈
      camTxt = 'f/' + a.N + ' · ' + fmtShutter(a.t) + ' · ISO ' + a.S + '（不变）';
      ratioTxt = '目标：闪光 ' + (R > 0 ? '亮 ' + R : R < 0 ? '暗 ' + (-R) : '等亮 0') + ' EV 于环境光（EV₁₀₀ = '
        + (ev100(a.N, a.t) - Math.log2(a.S / 100)).toFixed(1) + '）';
    } else {
      const k = parseFloat(document.querySelector('input[name=dk]:checked').value);
      const tLim = hss ? 1/8000 : 1/200;
      const tNew = Math.max(a.t / Math.pow(2, k), tLim);
      const kAp = k - Math.log2(a.t / tNew);   // 快门压不掉的部分转给光圈
      const aNew = a.N * Math.pow(2, kAp / 2);
      Nreq = aNew; // 闪光作为主体主光源
      camTxt = 'f/' + aNew.toFixed(1) + ' · ' + fmtShutter(tNew) + ' · ISO ' + a.S
        + (kAp > 0.01 ? '（快门已顶到 ' + fmtShutter(tLim) + '，光圈再收 ' + kAp.toFixed(1) + ' 档）' : '（全部由快门压暗）');
    }
  }

  const gnAvail = gnISO * hssF; // 全功率、ISO/HSS 修正后的可用 GN（未含功率档与 ND）

  let big, exact, std, diff;
  if (target === 'fap') {
    if (!(D > 0)) return setFMsg('请填写闪光灯到主体的距离。', 'err');
    const N = gnAvail * Math.sqrt(pw) / (D * ndF) * Math.pow(2, evT / 2);
    const n = nearest(APERTURES, N);
    big = '光圈 ≈ f/' + n.value;
    exact = 'f/' + N.toFixed(2);
    std = 'f/' + n.value;
    diff = fmtStops(n.stops);
    document.getElementById('a3').value = n.value;
  } else if (target === 'power') {
    if (!(D > 0)) return setFMsg('请填写闪光灯到主体的距离。', 'err');
    const gnReq = Nreq * D * ndF * Math.pow(2, evT / 2);
    const frac = Math.pow(gnReq / gnAvail, 2);
    if (frac > 1)
      return setFMsg('全功率也不够：请缩短距离、开大光圈或提高 ISO。', 'err');
    let step = POWERS[POWERS.length - 1];
    for (const P of POWERS) if (P >= frac) step = P; // 取满足需求的最小功率档
    const headroom = Math.log2(step / frac);
    big = '功率 ≈ ' + fmtPower(step);
    exact = '1/' + (1 / frac).toFixed(1);
    std = fmtPower(step) + (step >= 1 ? '（全功率）' : '');
    diff = '余量 ' + (headroom < 0.02 ? '≈ 0' : headroom.toFixed(2)) + ' 档';
    document.getElementById('p3').value = fmtPower(step);
  } else { // dist
    const Dmax = gnAvail * Math.sqrt(pw) / (Nreq * ndF) * Math.pow(2, evT / 2);
    const snapped = Math.max(0.3, Math.round(Dmax * 10) / 10);
    big = '距离 ≤ ' + snapped + ' m';
    exact = Dmax.toFixed(2) + ' m';
    std = snapped + ' m';
    diff = fmtStops(Math.log2(Dmax / snapped));
    document.getElementById('d3').value = snapped;
  }

  document.getElementById('fBig').textContent = big;
  document.getElementById('fExact').textContent = exact;
  document.getElementById('fStd').textContent = std;
  document.getElementById('fDiff').textContent = diff;
  document.getElementById('fCam').textContent = camTxt;
  document.getElementById('fNoteA').textContent = ratioTxt ||
    ({ standard: '标准直闪：闪光为主体主光源', fill: '', darken: '压暗背景：闪光补足主体，环境按设定欠曝' }[mode]);
  document.getElementById('fNoteB').textContent =
    '有效 GN = ' + (gnAvail).toFixed(1) + ' m' + (hssF < 1 ? '（HSS 已减半）' : '') + (nd > 0 ? '，ND 需 +' + nd + ' 档补偿' : '');
  document.getElementById('fresult').style.display = 'block';
  setFMsg('计算完成。', 'ok');
});

</script>
